  const PF_LOWPOWER_STEP5 = { chubu:true, tohoku:true, kansai:true, shikoku:true, kyushu:true }; // 低圧電力 段階固定5%
  function pfApplies(cat, area){

       連続式（高圧・特高・連続式低圧）：1+(85−pf)/100（pf100→0.85） */

    if(cat==="lowpower" && PF_LOWPOWER_STEP5[area]){

    }
    return 1 + (85 - p)/100;
  }

  /* === ヘルパ === */
  function levyForYM(year, month){
    if(!year) return null;
    const fy = (month>=5) ? year : year-1;
    const key = String(fy);
    if(LEVY_BY_FY[key]!=null) return LEVY_BY_FY[key];
    const yrs=Object.keys(LEVY_BY_FY).map(Number);
    const clamped=Math.min(Math.max(fy,Math.min(...yrs)),Math.max(...yrs));
    return LEVY_BY_FY[String(clamped)];
  }
  /* 容量拠出金を月→年度（4月始まり）で解決して引く。年度がデータ範囲外なら最近年度にクランプ。
     year未指定（シナリオ等）は LATEST.capacity 年度を使う。 */
  function capacityForYM(cat, year, month){
    const yrs=Object.keys(CAPACITY_BY_FY).map(Number);
    const fy = year ? ((month>=4) ? year : year-1) : Number(LATEST.capacity);
    const clamped=Math.min(Math.max(fy,Math.min(...yrs)),Math.max(...yrs));
    return (CAPACITY_BY_FY[String(clamped)]||{})[cat] || 0;
  }
  function normTou(tou){
    const avg=Object.keys(TOU_HOURS).reduce((s,b)=>s+tou[b]*TOU_HOURS[b],0)/24;
    const o={}; Object.keys(tou).forEach(b=>o[b]=tou[b]/avg); return o;
  }
  function effFactorOf(profileKey, weekdayOnly, touNorm, weekendRatio){
    const w=PROFILES[profileKey].w;
    const ewd=Object.keys(touNorm).reduce((s,b)=>s+(w[b]||0)*touNorm[b],0);
    return weekdayOnly ? ewd : ewd*(WD_SHARE + WE_SHARE*weekendRatio);
  }
  function daytimeShare(profileKey, weekdayOnly){
    const w=PROFILES[profileKey].w;
    const wdDay=Object.keys(w).reduce((s,b)=>s+(w[b]||0)*(BLOCK_DAYTIME[b]||0),0);
    return weekdayOnly ? wdDay : wdDay*WD_SHARE;
  }
  function areaFyAvg(area, fy){ return (AREA_FY_AVG[area]||AREA_FY_AVG["kansai"])[fy]; }

  /* === 旧一電 基礎データ（料金表＋月別燃調）===
     build時に window.__TERA_UTILITY__ へ注入（src外のxlsxから変換） */
  const UTILITY = (typeof window!=="undefined" && window.__TERA_UTILITY__) || { months:[], tariff:{}, fuel:{}, gov:{} };
  function utilPlans(area, cat){ return ((UTILITY.tariff||{})[area]||{})[cat] || []; }
  function utilFuel(area, cat){ return ((UTILITY.fuel||{})[area]||{})[cat] || {}; }
  // 政府割引（円/kWh・正値＝値引き）。区分：高圧/特別高圧→kouatsu扱い, 低圧→lowvolt。エリア共通・月別。
  function govDiscountForYM(cat, year, month){
    const g = UTILITY.gov || {};
    // 特別高圧は政府の電気料金支援（激変緩和措置・料金支援等）の対象外 → 割引なし
    if(cat==="toksubetsu") return 0;
    const key = (cat==="lighting" || cat==="lowpower") ? "lowvolt" : "kouatsu";
    const table = g[key] || {};
    if(!year || !month) return 0;
    const ym = `${year}-${String(month).padStart(2,"0")}`;
    return Number(table[ym]) || 0;
  }

  /* === 従量電灯：区分判定（アンペア制/最低料金制対応） === */
  function lightingClass(area, amp){
  const M = RATE_PLANS[area].method;
  if(M === 'min_charge'){
    return (!amp || amp===0) ? 'A' : 'B';
  } else {
    // アンペア制：10〜60Aの整数アンペアならB、それ以外はC（暫定）
    if([10,15,20,30,40,50,60].includes(amp)) return 'B';
    return 'C';
  }
}

  /* === 従量電灯：本体計算（A/B/C・規制/自由・区分明示・容量単位別）===
     cls＝区分（A/B/C）。cap＝契約容量：B(ampere)=アンペア / C・B(kva)=kVA / A=不問。
     旧 amp/10 換算は廃止し、cap を区分の単位でそのまま解釈する。 */
  function lightingBody(area,sysk,kwh,cap,cls){
  const MD = RATE_PLANS[area].method;
  const plansByClass = RATE_PLANS[area]['lighting_'+sysk];
  if(!cls) cls = lightingClass(area, cap); // 区分未指定時は容量から推定（後方互換）
  let P = plansByClass[cls];
  if(!P || !P.confirmed){
    // 未確定区分は代替へfallback（最低料金制→A、アンペア制→B）
    P = (MD==='min_charge') ? (plansByClass.A||plansByClass.B||P) : (plansByClass.B||plansByClass.C||P);
  }
  const [b1,b2]=P.tierBnd; const t=P.tiers;
  // 三段階従量（最低料金制Aは minChargeKwh まで無料枠）
  const startFree = P.minCharge!=null ? (P.minChargeKwh||0) : 0;
  let e=(Math.min(kwh,b1)-Math.min(kwh,startFree))*t[0];
  if(kwh>b1)e+=(Math.min(kwh,b2)-b1)*t[1];
  if(kwh>b2)e+=(kwh-b2)*t[2];
  // 基本料金（区分の単位で cap を解釈）
  let base;
  if(P.minCharge!=null){            // 従量電灯A：最低料金制
    if(kwh<=startFree) return {body:P.minCharge, base:P.minCharge, energy:0, P, cls};
    base = P.minCharge;
  } else if(P.basicByAmp){          // B（アンペア制）：cap=アンペア
    base = P.basicByAmp[cap] ?? P.basicByAmp[30];
  } else {                          // C / B（kVA制）：cap=kVA
    base = P.basicByKva * Math.max(cap, 6); // 最低6kVA
  }
  const body = Math.max(base + e, P.minMonthly || 0);
  const baseAdj = (body > base + e) ? body - e : base; // minMonthly適用時は基本側を底上げ
  return {body, base:baseAdj, energy:e, P, cls};
}

  /* === 低圧電力（動力）：本体計算（base/energy分離） === */
  function lowpowerBody(area,sysk,kwh,kw,pf,month){
  const P=RATE_PLANS[area]['lowpower_'+sysk];
  const summer=[7,8,9].includes(month);
  const unit=summer?P.seasonal.summer:P.seasonal.other;
  let pfFactor=1; if(P.pf){ pfFactor = pfFactorFor("lowpower", area, pf); } // 力率割引：方式はエリア依存（中部=段階5%/他=連続式）
  const base=P.basicPerKw*kw*pfFactor;
  const energy=unit*kwh;
  return {body:base+energy, base, energy, P, pfFactor};
}

  /* === 旧一電 比較プラン一覧を RATE_PLANS から生成（低圧2区分・規制/自由×区分） ===
     返り値の各プラン：{ label, system:"reg"|"free"|"free2", cls?(lighting), cat, confirmed, capUnit, ratekey? }
       - system        ：燃調系統の解決キー（lighting_reg / lowpower_free 等）にも使う
       - ratekey        ：本体料金の RATE_PLANS ノード指定（free2 等。既定は system と同じ）
       - capUnit        ：契約容量入力の単位ヒント（"A"=アンペア / "kVA" / "fixed"=不問 / "kW"）
     高圧/特別高圧は従来どおり utilData.tariff（plansOf）から引く（この関数は低圧専用）。 */
  function ratePlansFor(area, cat){
  const node = RATE_PLANS[area]; if(!node) return [];
  const out = [];
  if(cat==="lighting"){
    const order = (node.method==="min_charge") ? ["A","B"] : ["B","C"];
    [["reg","規制"],["free","自由"]].forEach(([sys,sl])=>{
      const plans = node["lighting_"+sys] || {};
      order.forEach(cls=>{
        const P = plans[cls]; if(!P) return;
        const nm = P.plan ? `${sl}・従量電灯${cls}（${P.plan}）` : `${sl}・従量電灯${cls}`;
        const capUnit = (cls==="A") ? "fixed" : ((node.method==="ampere" && cls==="B") ? "A" : "kVA");
        out.push({ label:nm, system:sys, cls, cat:"lighting", confirmed:!!P.confirmed, capUnit });
      });
    });
  } else if(cat==="lowpower"){
    [["reg","規制"],["free","自由"],["free2","自由Ⅱ"]].forEach(([sys,sl])=>{
      const P = node["lowpower_"+sys]; if(!P) return;
      const nm = P.plan ? `${sl}・低圧電力（${P.plan}）` : `${sl}・低圧電力`;
      // free2 の燃調は自由系統(free)に解決させる（fuel に lowpower_free2 は無いため）
      const fuelSys = (sys==="free2") ? "free" : sys;
      out.push({ label:nm, system:fuelSys, ratekey:sys, cat:"lowpower", confirmed:!!P.confirmed, capUnit:"kW" });
    });
  }
  return out;
}
